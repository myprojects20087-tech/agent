<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS PRIME - Enterprise Browser Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #030305;
      --bg-panel: rgba(15, 15, 20, 0.7);
      --bg-elevated: rgba(25, 25, 35, 0.85);
      --bg-input: rgba(30, 30, 45, 0.6);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --accent-secondary: #8b5cf6;
      --success: #10b981;
      --danger: #ef4444;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(51, 65, 85, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
      perspective: 1500px; /* 3D Space */
      background-image:
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
    }

    /* Layout */
    .container {
      display: flex;
      width: 100%;
      height: 100%;
      /* Subtle overall 3D tilt */
      transform: translateZ(0);
      transform-style: preserve-3d;
    }

    /* 3D Glass Panels */
    .left-panel, .right-panel {
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .left-panel {
      width: 65%;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      z-index: 5;
    }

    .right-panel {
      width: 35%;
      background: rgba(10, 10, 15, 0.85);
      box-shadow: -20px 0 50px rgba(0,0,0,0.8);
      z-index: 10;
      /* 3D floating effect for chat */
      transform: translateZ(20px);
    }

    /* Left Panel: Header */
    .browser-header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(5, 5, 8, 0.6);
      transform: translateZ(5px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px var(--accent-glow);
    }

    /* 3D URL Bar */
    .url-bar-container {
      flex-grow: 1;
      max-width: 500px;
      margin: 0 24px;
      position: relative;
      perspective: 500px;
    }
    .url-bar {
      width: 100%;
      background: linear-gradient(145deg, var(--bg-input), rgba(20,20,30,0.8));
      border: 1px solid var(--border);
      border-bottom: 2px solid rgba(255,255,255,0.1);
      padding: 10px 16px 10px 40px;
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.3);
      transform: translateZ(0);
    }
    .url-bar:focus {
      border-color: var(--accent);
      transform: translateZ(10px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 10px 20px var(--accent-glow);
    }
    .url-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%) translateZ(5px);
      color: var(--text-muted);
    }

    /* Status Dot */
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 15px var(--success), inset 0 0 5px #fff;
    }

    /* Left Panel: Main View */
    .browser-main {
      flex-grow: 1;
      display: flex;
      position: relative;
      background: #000;
      overflow: hidden;
      perspective: 1000px;
    }

    .browser-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      z-index: 5;
    }

    /* 3D Holographic Radar */
    .radar-3d {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 2px solid rgba(59, 130, 246, 0.3);
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(60deg) rotateZ(0deg);
      animation: spin3d 4s linear infinite;
      box-shadow: 0 0 40px var(--accent-glow), inset 0 0 40px var(--accent-glow);
    }
    .radar-3d::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 70%, rgba(59, 130, 246, 0.8) 100%);
    }
    @keyframes spin3d { to { transform: rotateX(60deg) rotateZ(360deg); } }

    /* Right Panel: Chat Header */
    .chat-header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 15, 0.9);
      transform: translateZ(10px);
    }

    /* 3D Chat Messages */
    .chat-messages {
      flex-grow: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
      transform-style: preserve-3d;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }

    .message {
      max-width: 88%;
      animation: msg-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0;
      transform: translateY(30px) translateZ(-20px) scale(0.9);
      line-height: 1.6;
      font-size: 14px;
      position: relative;
    }
    @keyframes msg-pop {
      to { opacity: 1; transform: translateY(0) translateZ(0) scale(1); }
    }

    .msg-user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
      color: white;
      padding: 14px 20px;
      border-radius: 16px 16px 4px 16px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4), inset 0 2px 4px rgba(255,255,255,0.3);
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* Action Card 3D Effect */
    .msg-action {
      align-self: flex-start;
      background: linear-gradient(180deg, rgba(30,30,40,0.9) 0%, rgba(15,15,20,0.9) 100%);
      padding: 16px;
      border-radius: 12px 16px 16px 16px;
      border: 1px solid rgba(255,255,255,0.05);
      border-left: 4px solid var(--accent);
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: transform 0.2s;
    }
    .msg-action:hover {
      transform: translateZ(10px) translateY(-2px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px var(--accent-glow);
    }

    /* Input Area 3D Button */
    .chat-input-area {
      padding: 24px;
      background: linear-gradient(0deg, rgba(5,5,8,1) 40%, transparent 100%);
      transform: translateZ(15px);
    }
    .input-wrapper {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.05);
      transform-style: preserve-3d;
      transition: all 0.3s;
    }
    .input-wrapper:focus-within {
      border-color: var(--accent);
      transform: translateZ(10px);
      box-shadow: 0 15px 40px rgba(59, 130, 246, 0.2), inset 0 2px 4px rgba(255,255,255,0.1);
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 15px;
      resize: none;
      outline: none;
      min-height: 24px;
    }

    /* 3D Push Button */
    .btn-action {
      background: linear-gradient(to bottom, #60a5fa, #3b82f6);
      color: white;
      border: none;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      position: absolute;
      right: 12px;
      bottom: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #2563eb, 0 8px 15px rgba(59, 130, 246, 0.4);
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .btn-action:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #2563eb, 0 2px 5px rgba(59, 130, 246, 0.4);
    }

    /* 3D Chip Suggestions */
    .chip {
      background: linear-gradient(145deg, rgba(40,40,55,0.8), rgba(20,20,30,0.8));
      border: 1px solid rgba(255,255,255,0.05);
      border-bottom: 3px solid rgba(0,0,0,0.5);
      padding: 16px;
      border-radius: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateZ(0);
    }
    .chip:hover {
      transform: translateY(-4px) translateZ(15px);
      border-color: var(--accent);
      color: var(--text-primary);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 0 15px var(--accent-glow);
    }
  </style>
</head>
<body>

  <div class="left-panel" id="panel-left">
    <div class="browser-header">
      <div class="brand">
        <span class="brand-logo">⬢</span> NEXUS
      </div>
      <div class="url-bar-container">
        <span class="url-icon">🔒</span>
        <input type="text" class="url-bar" id="current-url" value="about:blank" readonly>
      </div>
      <div class="status-dot offline" id="status-dot"></div>
    </div>

    <div class="browser-main">
      <div id="browser-placeholder" class="browser-placeholder">
        <div class="radar-3d"></div>
        <h3 style="margin-top: 40px; letter-spacing: 2px;">SECURE ENCLAVE</h3>
      </div>
    </div>
  </div>

  <div class="right-panel" id="panel-right">
    <div class="chat-header">
      <div style="font-weight: 600; letter-spacing: 1px;">Operations Comm</div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="empty-state" id="empty-state" style="display: flex; flex-direction: column; gap: 16px; align-items: center; margin-top: 40px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%;">
          <div class="chip" onclick="setPrompt('Analyze market trends')">📈 Market Analysis</div>
          <div class="chip" onclick="setPrompt('Audit security logs')">🛡️ Security Audit</div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="Initiate directive..." rows="1" oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
        <button id="btn-send" class="btn-action" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>

  <script>
    const ui = {
      msgs: document.getElementById('chat-messages'),
      input: document.getElementById('chat-input'),
      empty: document.getElementById('empty-state')
    };

    // 3D Parallax effect on mouse move
    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 100;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 100;
      document.getElementById('panel-left').style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      document.getElementById('panel-right').style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg) translateZ(20px)`;
    });

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function setPrompt(text) {
      ui.input.value = text;
      autoResize(ui.input);
    }

    function handleEnter(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function appendMessage(text, type) {
      ui.empty.style.display = 'none';
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.innerText = text;
      ui.msgs.appendChild(div);
      ui.msgs.scrollTo({ top: ui.msgs.scrollHeight, behavior: 'smooth' });
    }

    async function sendMessage() {
      const text = ui.input.value.trim();
      if (!text) return;

      ui.input.value = '';
      autoResize(ui.input);
      appendMessage(text, 'msg-user');

      // Simulate real-time SSE Streaming
      try {
        const response = await fetch('/api/v1/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');

        let assistantDiv = document.createElement('div');
        assistantDiv.className = 'message msg-nexus';
        ui.msgs.appendChild(assistantDiv);

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          // Parse Server-Sent Events format
          const lines = chunk.split('\n');
          for (let line of lines) {
              if (line.startsWith('data: ')) {
                  const data = JSON.parse(line.substring(6));
                  if (data.type === 'token') {
                      assistantDiv.innerHTML += data.text.replace(/\n/g, '<br>');
                      ui.msgs.scrollTo({ top: ui.msgs.scrollHeight });
                  } else if (data.type === 'action') {
                      appendMessage("⚡ Executing CDP Action: " + data.action, 'msg-action');
                  }
              }
          }
        }
      } catch (e) {
        appendMessage("Error: " + e.message, 'msg-action failed');
      }
    }
  </script>
</body>
</html>
